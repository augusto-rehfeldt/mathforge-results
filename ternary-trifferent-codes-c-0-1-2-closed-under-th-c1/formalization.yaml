version: "v0.4"
project:
  name: "Refuted: Six-word affine blocks admit shift-invariant compatible outer codes with one information bit per block"
  description: "A counterexample to the claim: For every integer m ≥ 1, there exists a set D ⊆ (F₃ × {0,1})^m of cardinality at least 3·2^m, invariant under the map ((a_j,b_j))_{j=1}^m ↦ ((a_j+1,b_j))_{j=1}^m, with the following property. For every three distinct elements d^(1), d^(2), d^(3) of D, there is an index j ∈ {1,…,m} satisfying one of these two conditions: (i) b_j^(1)=b_j^(2)=b_j^(3) and the three values a_j^(1), a_j^(2), a_j^(3) are pairwise distinct; (ii) exactly two of the three values b_j^(1), b_j^(2), b_j^(3) agree, and the corresponding two values of a are different."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
