version: "v0.4"
project:
  name: "Refuted: Every nonoptimal distinct-subset-sum set admits a maximum-reducing replacement of at most half its elements plus one"
  description: "A counterexample to the claim: For every integer n ≥ 2 and every set A of n positive integers having distinct subset sums, suppose there exists a set C of n positive integers having distinct subset sums with max C < max A. Then there exist a subset R of A and a set T of positive integers such that 1 ≤ |R| ≤ floor(n/2)+1, |T| = |R|, T is disjoint from A\\R, T has distinct subset sums, D(T) ∩ D(A\\R) = {0}, and max((A\\R) ∪ T) < max A."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
