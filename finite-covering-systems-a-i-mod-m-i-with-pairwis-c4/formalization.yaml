version: "v0.4"
project:
  name: "Refuted: Every distinct odd cube-free congruence family leaves an uncovered CRT box with two exclusions per prime"
  description: "A counterexample to the claim: For every integer k ≥ 1, every collection of pairwise distinct odd integers m_1,...,m_k > 1 such that no prime cube divides any m_i, and every choice of integers a_1,...,a_k, put L = lcm(m_1,...,m_k). For each prime p dividing L, let e_p be its exponent in L. There exist sets B_p ⊆ Z/pZ with |B_p| ≥ p−2 and functions f_p: B_p → Z/p^{e_p}Z satisfying f_p(b) ≡ b modulo p, such that every residue x ∈ Z/LZ whose coordinate modulo p^{e_p} belongs to f_p(B_p) for every prime p dividing L satisfies x ≠ a_i modulo m_i for every i ∈ {1,...,k}."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
