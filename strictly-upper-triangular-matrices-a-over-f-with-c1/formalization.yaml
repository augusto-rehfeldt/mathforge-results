version: "v0.4"
project:
  name: "Refuted: Nine boundary bits and one binary subspace determine every rank-refined extension of a bandwidth-three square-zero matrix"
  description: "A counterexample to the claim: Conjecture. For every integer n≥0, the polynomials F_n(H,I) defined below satisfy the following autonomous recurrence. Initialize F_0(0,{0})=1 and all other states at zero. For each state (H,I) and each v=(v₁,v₂,v₃) in F₂³ satisfying Hv=0, add F_n(H,I)t^ε x₁^{v₃}x₂^{v₂}x₃^{v₁} to F_{n+1}(H′,I′), where ε=0 if v∈I and ε=1 otherwise. Here H′ is the 6-by-3 matrix whose first two columns are (H_{2,2},H_{3,2},H_{4,2},H_{5,2},H_{6,2},0)ᵀ and (H_{2,3},H_{3,3},H_{4,3},H_{5,3},H_{6,3},0)ᵀ, and whose third column is (0,0,v₁,v₂,v₃,0)ᵀ. Also I′={(a,b,0):(0,a,b)∈I+span(v)}. No information about the interior matrix beyond (H,I) is needed, including when different interior matrices have different kernel dimensions."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
