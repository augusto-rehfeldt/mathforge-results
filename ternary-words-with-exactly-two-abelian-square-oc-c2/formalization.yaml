      tool_setup: "Models proposed the claim, wrote Python search and re-check scripts that were executed, and wrote the Lean file, repaired against Lean's own errors; the axiom report was read with #print axioms."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
