version: "v0.4"
project:
  name: "Refuted: A ternary word with exactly two crossing abelian squares has length plus overlap at most fifteen"
  description: "A counterexample to the claim: For every integer n ≥ 1 and every word w in {0,1,2}^n, suppose w has exactly two abelian-square occurrences, with intervals [a,a+2p−1] and [b,b+2q−1], where a,b,p,q are positive integers satisfying 1 ≤ a < b ≤ a+2p−1 < b+2q−1 ≤ n. Then n + a + 2p − b ≤ 15."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
classification:
  arxiv:
    - "math.CO"
  msc2020:
    - "68R15"
    - "05D10"
sources:
  -
    title: "Refutation of a conjecture proposed by a language model in an automated mathforge run"
    type: "original-proof"
    relationship: "other"
    note: "Novelty was screened only by an automated search of arXiv, Crossref and OpenAlex; the result may be a rediscovery."
related_formalizations: []
