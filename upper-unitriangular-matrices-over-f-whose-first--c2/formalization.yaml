version: "v0.4"
project:
  name: "Refuted: For matrices of order at least six, only two inverse weights sit closest below the maximum"
  description: "A counterexample to the claim: For every integer n≥6, let A range over the n×n upper unitriangular matrices over F₂ whose first superdiagonal is all ones and whose entries outside the diagonal and first two superdiagonals are zero. If A is not the matrix with zero second superdiagonal, then its inverse has at most n(n−1)/2−(n−2) nonzero entries above the diagonal. Equality holds exactly when the second superdiagonal has a single one, at its first or last position."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
