version: "v0.4"
project:
  name: "Refuted: Reciprocal cross-cycle defects synchronize exactly when their combined offset is coprime to the cycle lengths, within Černý’s bound"
  description: "A counterexample to the claim: For every pair of integers p,q ≥ 2 and every pair of integers r,s with 1 ≤ r < q and 1 ≤ s < p, consider the deterministic automaton with state set Q = {C_0,…,C_{p−1},D_0,…,D_{q−1}} and alphabet {a,b}. Define a(C_i)=C_{(i+1) mod p} and a(D_j)=D_{(j+1) mod q}. Define b(C_0)=D_r and b(D_0)=C_s, and let b fix every other state. This automaton admits a reset word if and only if gcd(p,q,r+s)=1. Whenever this greatest common divisor equals 1, it admits a reset word of length at most (p+q−1)²."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
