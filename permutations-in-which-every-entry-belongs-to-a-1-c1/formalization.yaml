version: "v0.4"
project:
  name: "Refuted: A permutation whose 132-incidence graph is a tree consists of an initial minimum followed by increasing reversed pairs"
  description: "A counterexample to the claim: For every integer n ≥ 1, let T_n be the set of permutations of {1,…,n} in which every entry belongs to a 132-occurrence and the entry–occurrence incidence graph is a tree. Conjecturally, T_n is empty unless n = 2m+1 for an integer m ≥ 1, and T_{2m+1} consists exactly of the permutation (1,3,2,5,4,…,2m+1,2m). Consequently, for every m ≥ 1, the polynomial sum over π in T_{2m+1} of q^{inv(π)}t^{des(π)} equals q^m t^m. For m ≥ 2, deleting the two entries belonging exclusively to any one occurrence and then standardizing gives the unique member of T_{2m−1}, decreasing both inversion number and descent number by exactly one."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
