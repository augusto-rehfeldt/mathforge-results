version: "v0.4"
project:
  name: "Refuted: Exactly two equal-sum relations in a gapless sequence must have supports intersecting in exactly two indices"
  description: "A counterexample to the claim: For every integer n >= 1 and every strictly increasing sequence of positive integers a_1 < ... < a_n, suppose there are exactly two unordered pairs {I,J} of disjoint nonempty subsets of {1,...,n} satisfying sum_{i in I} a_i = sum_{j in J} a_j. Denote these pairs by {I_1,J_1} and {I_2,J_2}, and put R_1 = I_1 union J_1 and R_2 = I_2 union J_2. If every integer from 0 through S = sum_{i=1}^n a_i is the sum of some subset of the sequence, then |R_1 intersection R_2| = 2."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
