version: "v0.4"
project:
  name: "Refuted: An even permutation block realizes every parity-compatible boundary state exactly when its matching breaks positional parity"
  description: "A counterexample to the claim: For every even integer m ≥ 2 and every permutation π of {1,…,m}, form a graph with vertices u₁,…,uₘ,v₁,…,vₘ, path edges uᵢuᵢ₊₁ and vᵢvᵢ₊₁ for 1 ≤ i < m, matching edges uᵢvπ(i) for 1 ≤ i ≤ m, and four dangling edges incident respectively with u₁,v₁,uₘ,vₘ. The following are equivalent: (i) there exists i such that π(i) and i have different parity; (ii) for every ordered quadruple (A,B,C,D) of two-element subsets of {1,2,3,4,5,6} such that each color belongs to an even number of A,B,C,D, there is an assignment of a two-element color set to every edge, including every dangling edge, whose prescribed dangling-edge sets are respectively A,B,C,D and whose three incident edge sets at every vertex partition {1,2,3,4,5,6}."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
