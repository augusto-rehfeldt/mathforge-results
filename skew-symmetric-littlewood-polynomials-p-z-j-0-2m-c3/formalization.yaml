version: "v0.4"
project:
  name: "Refuted: Every skew-symmetric Littlewood sequence stable under parity-block flips has asymptotic merit factor at least four"
  description: "A counterexample to the claim: For every integer m ≥ 1, let a = (a_0,…,a_{2m}) be a sequence with entries in {−1,1} satisfying a_{m+j} = (−1)^j a_{m−j} for every integer j with 0 ≤ j ≤ m. Suppose E(a) ≤ E(T_{u,v,d}a) for every d ∈ {1,2} and every pair of integers 0 ≤ u ≤ v ≤ m with d dividing v−u. Then E(a) ≤ (2m+1)^2/8 + 2(2m+1)."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
