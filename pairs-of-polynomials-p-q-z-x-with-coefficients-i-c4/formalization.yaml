version: "v0.4"
project:
  name: "Refuted: Every two-collision polynomial pair splits into independently movable collision blocks unless its collisions form a two-by-three arithmetic core"
  description: "A counterexample to the claim: For every pair of finite sets A,B of nonnegative integers containing 0, suppose the number r(s) of pairs (a,b) in A×B with a+b=s is at most 2 for every nonnegative integer s, and equals 2 at exactly two integers. Then exactly one of the following alternatives holds. (I) After possibly exchanging A and B, there is a partition A=U∪V into disjoint nonempty sets with 0 in U such that U+B and V+B are disjoint and each of the two restricted representation functions has exactly one coefficient equal to 2. Write their doubled exponents as c_U and c_V. For every integer T>max(A)+max(B), the supports A_T=U∪{v+T:v in V} and B have sizes |A| and |B|, their product has exactly two doubled exponents c_U and c_V+T, and the separation of these exponents is T+c_V−c_U. (II) After possibly exchanging A and B, there exist nonnegative integers u,v and a positive integer d such that {u,u+d}⊆A and {v,v+d,v+2d}⊆B, and the complete set of pairs participating in doubled coefficients is {(u,v+d),(u+d,v),(u,v+2d),(u+d,v+d)}. In alternative (II), the doubled exponents have separation d and no partition of either support satisfies the splitting conditions in alternative (I)."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
