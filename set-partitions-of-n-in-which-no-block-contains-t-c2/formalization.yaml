version: "v0.4"
project:
  name: "Refuted: Odd-length partition counts modulo two reduce to weighted matchings on blocks of half-length partitions"
  description: "A counterexample to the claim: For every integer m≥2, the following polynomial congruence holds coefficientwise modulo 2: F_{2m+1}(x,y,z) ≡ Σ_Q Σ_{D,I,M} x^{2b−|I|−2δ+1} y^{2u+1−δ} z^{2a(Q)}. The outer sum ranges over all admissible partitions Q of [m]. In each inner sum, D is either absent or a block of Q containing neither m−1 nor m; δ is 0 or 1 according as D is absent or present. The set I is any subset of the blocks other than D that excludes the block containing m. The object M is any matching on the blocks outside I and D. The integer u counts singleton blocks of Q outside I and D that are unmatched in M."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
