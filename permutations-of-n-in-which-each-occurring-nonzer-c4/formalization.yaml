version: "v0.4"
project:
  name: "Refuted: A six-cycle using three nonresonant displacement lengths fits exactly when its available span reaches largest plus middle minus smallest"
  description: "A counterexample to the claim: For every choice of integers 1 ≤ a < b < c with c ≠ a+b, and every integer n ≥ 6, there exists a permutation π of {1,…,n} having exactly one cycle of length six and n−6 fixed points, whose nonzero signed displacements consist exactly of +a, −a, +b, −b, +c, −c, if and only if n ≥ b+c−a+1."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
