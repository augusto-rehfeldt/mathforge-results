version: "v0.4"
project:
  name: "Refuted: A diamond relation among four minimal generators forces Wilf’s surplus to pay for multiplicity and Apéry ambiguity"
  description: "A counterexample to the claim: Conjecture: For every four integers m,a,b,d satisfying 4 ≤ m < a < b < d, gcd(m,a,b,d)=1, and a+b=m+d, suppose that {m,a,b,d} is the minimal generating set of the numerical semigroup S they generate. Let c be its conductor, let L=S∩{0,…,c−1}, and let A={s∈S:s−m∉S}. Define q to be the number of elements w∈A for which there exist two distinct triples (x,y,z),(x′,y′,z′)∈Z≥0³ satisfying w=xa+yb+zd=x′a+y′b+z′d. Then 4|L|−c ≥ m−4+q."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
