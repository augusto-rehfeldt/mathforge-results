version: "v0.4"
project:
  name: "Refuted: Exactly two crossing abelian squares of equal half-length must start at consecutive positions"
  description: "A counterexample to the claim: For every integer n ≥ 1 and every word w of length n over {0,1,2}, suppose w has exactly two abelian-square occurrences. Write their intervals as [i,i+2h) and [j,j+2h), where h ≥ 1 and 0 ≤ i < j < i+2h ≤ n and j+2h ≤ n. Then j=i+1. Equivalently, their overlap has length 2h−1."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
classification:
  arxiv:
    - "math.CO"
  msc2020:
    - "68R15"
    - "05A05"
sources:
