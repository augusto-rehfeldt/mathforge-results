version: "v0.4"
project:
  name: "Refuted: Compressing two prime-sized residue classes preserves partition counts modulo prime squares, apart from an explicit paired-block correction"
  description: "A counterexample to the claim: For every prime p ≥ 5 and every integer n ≥ 3p−1, let A consist of the p smallest elements of [n] congruent to 1 modulo 3, let B consist of the p smallest elements congruent to 2 modulo 3, and put R = [n] \\ (A ∪ B). Then, coefficientwise in the integer polynomial ring Z[x,y], F_[n](x,y) ≡ H_R,p(x,y) + p! x^p F_R(x,y) modulo p²."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
