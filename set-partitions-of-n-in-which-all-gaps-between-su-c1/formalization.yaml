version: "v0.4"
project:
  name: "Refuted: Odd refined partition counts lie on one diagonal, with parity determined by subsets of centered pairs"
  description: "A counterexample to the claim: For every integer n ≥ 1 and all nonnegative integers k, s, t, m, let A(n,k,s,t,m) count partitions of [n] having globally distinct successive-element gaps, k blocks, s singleton blocks, total gap sum t, and sum of block maxima m. Set r=n−k. Conjecture: A(n,k,s,t,m) is congruent modulo 2 to the number of subsets I of {1,…,⌊n/2⌋} satisfying |I|=r and ∑_{i∈I}(n+1−2i)=t, provided s=2k−n and 2m=k(n+1)+t; otherwise A(n,k,s,t,m) is even."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
