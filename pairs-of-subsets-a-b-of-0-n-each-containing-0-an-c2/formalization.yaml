version: "v0.4"
project:
  name: "Refuted: Nonreflection homometric sets differing in only two points each occupy at most half their ambient interval"
  description: "A counterexample to the claim: For every integer n ≥ 1 and every pair of distinct subsets A,B of {0,…,n}, suppose that 0,n belong to both sets, that |A|=|B|=k, that |A∩B|=k−2, and that for every integer t with 1≤t≤n the numbers of pairs (a,a′)∈A×A and (b,b′)∈B×B satisfying a′−a=t and b′−b=t are equal. If B≠{n−a:a∈A}, then n≥2k−1."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
