# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"
project:
  name: "Refuted: The rightmost square determines exactly how many further letters preserve the two overlapping square occurrences"
  description: "A counterexample to the claim: For every integer n ≥ 1 and every binary word w of length n having exactly two square occurrences whose intervals overlap and neither contains the other, let b be the final position of the occurrence that starts later, let r be its root length, and put t = n − b. Then r belongs to {1,2}. If r = 1, then 0 ≤ t ≤ 2 and, for every integer k ≥ 0, exactly one binary word x of length k makes wx have exactly two square occurrences when k ≤ 2 − t, and no such x exists when k > 2 − t. If r = 2, then t = 0 and no nonempty binary word x makes wx have exactly two square occurrences."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
classification:
  arxiv:
