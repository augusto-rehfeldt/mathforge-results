version: "v0.4"
project:
  name: "Refuted: Two opposite correlation defects force even length and tightly constrain coefficientwise Hamming distance"
  description: "A counterexample to the claim: For every integer n≥3, every pair of integers 1≤d<e<n, every nonzero integer c, and every pair A(x)=∑_{i=0}^{n−1}a_i x^i and B(x)=∑_{i=0}^{n−1}b_i x^i with a_i,b_i∈{−1,1}, suppose the Laurent-polynomial identity A(x)A(x⁻¹)+B(x)B(x⁻¹)=2n+c(x^d+x⁻ᵈ−x^e−x⁻ᵉ) holds. Then n and c are even. Moreover, writing h for the coefficientwise Hamming distance, if c is divisible by 4 then h=n/2; otherwise d+e=n and h belongs to {n/2−2,n/2,n/2+2}."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
