version: "v0.4"
project:
  name: "Refuted: Every strongly connected tournament with edge-triangle capacity two admits a connectivity-preserving vertex deletion of weighted triangle cost at most eight"
  description: "A counterexample to the claim: For every integer n >= 4 and every strongly connected tournament T on n vertices in which each directed edge belongs to at most two directed triangles, there exists a vertex v such that T-v is strongly connected and a_T(v) + b_T(v) <= 8."
  authors:
