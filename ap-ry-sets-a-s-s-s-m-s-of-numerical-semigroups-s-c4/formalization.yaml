version: "v0.4"
project:
  name: "Refuted: Lowering the largest generator by the multiplicity cannot decrease Wilf surplus when the conductor drops by a full multiplicity"
  description: "A counterexample to the claim: Conjecture. For every quadruple of integers m,a,b,d satisfying 4 ≤ m < a < b < 2m ≤ d and gcd(m,a,b,d)=1, let S=⟨m,a,b,d⟩ and T=⟨m,a,b,d−m⟩. Suppose that each displayed generating set is minimal and that c(S)−c(T) ≥ m. Then 4(g(S)−g(T)) ≤ 3(c(S)−c(T)). Equivalently, W₄(S) ≥ W₄(T)."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
