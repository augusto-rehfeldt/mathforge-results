version: "v0.4"
project:
  name: "Refuted: Minimum nesting counts factor into cycle compositions and binary choices within each cycle"
  description: "A counterexample to the claim: For every pair of integers c ≥ 1 and n ≥ 3c, let A(n,c,j) count perfect matchings of [2n] whose arc-crossing graph has exactly c connected components, whose every vertex has degree two, and which have exactly j nested arc pairs. Conjecturally, A(n,c,j) = 0 for every integer j with 0 ≤ j < n−3c, and A(n,c,n−3c) = 2^(n−3c) binom(n−2c−1,c−1)."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
