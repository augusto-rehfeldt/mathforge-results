project:
  name: "Refuted: Every self-complementary Sidon family with given sum and maximum has even cardinality"
  description: "A counterexample to the claim: For all integers n >= 1, k >= 3, m >= 1, and s >= 1 with m <= n, if 2*s = k*(m+1) then N(n,k,s,m) is even, where N(n,k,s,m) is the number of subsets A of {1,...,n} with |A| = k, sum(A) = s, max(A) = m, and all sums a+b with a,b in A and a <= b pairwise distinct."
