version: "v0.4"
project:
  name: "Refuted: Opposite-end strip animals occur in even numbers unless their area and perimeter match two parity conditions"
  description: "A counterexample to the claim: For every integer n≥2 and all integers a,p≥0, let C(n,a,p) count connected cell sets in a 2×n strip whose first column contains only its top cell, whose last column contains only its bottom cell, and whose area and perimeter are a and p. Then C(n,a,p) is even whenever a is odd or p is not congruent to 2(n−1) modulo 4."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
