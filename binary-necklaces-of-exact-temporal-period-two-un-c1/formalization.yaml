version: "v0.4"
project:
  name: "Refuted: Period-two words containing consecutive zeros decompose into four block types, yielding an explicit weight-refined necklace gluing formula"
  description: "A counterexample to the claim: Conjecture: For every integer n≥3, a cyclic binary word x of length n containing consecutive zeros has exact temporal period two if and only if cutting at every maximal zero run of length at least two leaves blocks belonging to {1,11,111,101}, with at least one block belonging to {111,101}. Moreover, for all integers k≥1, a≥0, b≥0 and c≥1, let M(n,k,a,b,c) be the sum of n/s(N) over all binary necklaces N of length n whose representatives x have exact temporal period two, exactly k maximal zero runs of length at least two, unordered weight pair {a,b}, and exactly c changed positions. Then M(n,k,a,b,c) equals (n/k) times the coefficient of t^n u^a v^b q^c in P^k when a=b, and equals (n/k) times the sum of the coefficients of t^n u^a v^b q^c and t^n u^b v^a q^c in P^k when a≠b, where P=(t²/(1−t))(tuv+t²u²v²+t³q(u³v²+u²v³))."
  authors:
