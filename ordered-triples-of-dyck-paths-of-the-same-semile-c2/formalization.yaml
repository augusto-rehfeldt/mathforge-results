version: "v0.4"
project:
  name: "Refuted: Equal-height triple contacts permit middle-block reversal, preserving areas while exchanging pair-only shared peaks and valleys"
  description: "A counterexample to the claim: Conjecture: For every integer n≥2, integers 1≤a<b≤2n−1, integer H≥0, nonnegative integers A and B, subsets L and U of {1,…,2n−1}\\{a,b}, and nonnegative integers p12,v12,p23,v23, the following two finite sets have equal cardinality. The first consists of ordered Dyck triples with exactly two internal triple contacts, at a and b, both at height H; adjacent areas A and B; pair-only contact sets L and U; and middle-block shared-peak and shared-valley counts (p12,v12,p23,v23). The second has the same requirements except that its pair-only contact sets are R(L) and R(U), and its four counts are (v12,p12,v23,p23)."
  authors:
    - "Augusto Rehfeldt (operator of the mathforge pipeline)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Augusto Rehfeldt"
